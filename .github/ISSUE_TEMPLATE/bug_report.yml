name: Bug report
description: Report a reproducible problem using synthetic data.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities use Security → Report a vulnerability. Never include private testimony, work-email addresses, keys, or production data."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include Node/Bun and browser versions when relevant.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use fictional employers and synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
